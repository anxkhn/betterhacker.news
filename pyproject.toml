[project]
name = "betterhacker-news"
version = "1.0.0"
description = "A self-hosted Hacker News reader with five-minute feeds and local thumbnails"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.120,<1", "uvicorn>=0.38,<1", "jinja2>=3.1.6,<4", "pillow>=12,<13"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120
target-version = "py311"
